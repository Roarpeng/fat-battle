name: Build Android APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地稳定版对齐（Dart 3.12.x / pubspec sdk ^3.12.2）
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        # 只分析 lib，避免历史测试残留阻断 APK 产物；测试单独在后续 job 扩展
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        # 后端代理模式：APK 只注入 API_BASE_URL，不含百度/智谱密钥。
        # Secret API_BASE_URL 可覆盖默认服务器；为空则失败，避免再打出「在线识别未配置」的包。
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          API_BASE_URL="${API_BASE_URL:-http://111.229.178.88:8080}"
          API_BASE_URL="${API_BASE_URL%/}"
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is required (food recognition goes through backend only)"
            exit 1
          fi
          echo "Building with API_BASE_URL=$API_BASE_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fat-battle-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
