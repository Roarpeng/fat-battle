name: Build Android APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地稳定版对齐（Dart 3.12.x / pubspec sdk ^3.12.2）
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        # 只分析 lib，避免历史测试残留阻断 APK 产物；测试单独在后续 job 扩展
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        # 后端代理模式：APK 只注入 API_BASE_URL，不含百度/智谱密钥。
        # Secret API_BASE_URL 可覆盖默认服务器；为空则失败，避免再打出「在线识别未配置」的包。
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          API_BASE_URL="${API_BASE_URL:-http://111.229.178.88:8080}"
          API_BASE_URL="${API_BASE_URL%/}"
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL is required (food recognition goes through backend only)"
            exit 1
          fi
          echo "Building with API_BASE_URL=$API_BASE_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Rename APK for release
        if: github.event_name != 'pull_request'
        id: apk
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: //p' pubspec.yaml | cut -d'+' -f1)"
          BUILD="$(sed -n 's/^version: //p' pubspec.yaml | cut -d'+' -f2)"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          # 文件名用拼音，避免 GitHub Releases 丢弃中文；桌面显示名仍是「塑身工坊」
          APK_NAME="SuxingGongfang-${VERSION}.apk"
          mkdir -p dist-apk
          cp "$APK_SRC" "dist-apk/${APK_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist-apk/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: suxing-gongfang-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        # Actions Artifact ≠ GitHub Releases；master 构建成功后同步到 Releases 页
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.apk.outputs.version }}"
          BUILD="${{ steps.apk.outputs.build }}"
          APK_NAME="${{ steps.apk.outputs.apk_name }}"
          APK_PATH="${{ steps.apk.outputs.apk_path }}"

          NOTES="$(cat <<EOF
          ## 塑身工坊 Android APK

          - **版本**: ${VERSION}+${BUILD}
          - **安装包**: \`${APK_NAME}\`（安装后桌面显示「塑身工坊」）
          - **Commit**: \`${GITHUB_SHA}\`
          - **工作流**: [Run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          下载下方 APK 安装即可（当前为 debug 签名）。
          EOF
          )"

          # 滚动更新 latest，保证 Releases 页始终有可下载的最新 APK
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest "$APK_PATH" \
            --title "塑身工坊 v${VERSION}" \
            --notes "$NOTES" \
            --latest
