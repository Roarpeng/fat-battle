name: Build Android APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地稳定版对齐（Dart 3.12.x / pubspec sdk ^3.12.2）
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        # 只分析 lib，避免历史测试残留阻断 APK 产物；测试单独在后续 job 扩展
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        # 当前 release 使用 debug 签名（见 android/app/build.gradle.kts），CI 无需 keystore
        run: flutter build apk --release

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fat-battle-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        # Actions Artifact ≠ GitHub Releases；master 构建成功后同步到 Releases 页
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: //p' pubspec.yaml | cut -d'+' -f1)"
          BUILD="$(sed -n 's/^version: //p' pubspec.yaml | cut -d'+' -f2)"
          APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          APK_NAME="fat-battle-${VERSION}.apk"
          cp "$APK_SRC" "$APK_NAME"

          NOTES="$(cat <<EOF
          ## 减肥大作战 Android APK

          - **版本**: ${VERSION}+${BUILD}
          - **Commit**: \`${GITHUB_SHA}\`
          - **工作流**: [Run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          下载下方 \`${APK_NAME}\` 安装即可（当前为 debug 签名）。
          EOF
          )"

          # 滚动更新 latest，保证 Releases 页始终有可下载的最新 APK
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest "$APK_NAME" \
            --title "Latest APK (v${VERSION})" \
            --notes "$NOTES" \
            --latest
