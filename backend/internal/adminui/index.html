<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塑身工坊 · 管理后台</title>
<style>
  :root {
    --bg: #14110E;          /* 炭黑 */
    --bg-2: #1C1814;        /* 炭黑浅一档 */
    --panel: #221D17;       /* 面板 */
    --border: #3A322A;
    --gold: #C4A574;        /* 铜金 */
    --gold-dim: #8A7450;
    --fire: #E85D4C;        /* 炉火红 */
    --fire-hover: #C94A3C;
    --text: #EDE4D5;
    --text-dim: #A99E8D;
    --ok: #6FBF73;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(180deg, #1E1913, #14110E);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .logo { font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
  header .logo span { color: var(--fire); }
  header .user { font-size: 13px; color: var(--text-dim); }
  header .user a { color: var(--fire); cursor: pointer; margin-left: 12px; }
  .tabs {
    display: flex; gap: 4px; padding: 10px 24px 0;
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    background: transparent; border: 1px solid transparent; border-bottom: none;
    color: var(--text-dim); padding: 10px 18px; cursor: pointer; font-size: 14px;
    border-radius: 8px 8px 0 0;
  }
  .tabs button.active { color: var(--gold); background: var(--panel); border-color: var(--border); }
  main { padding: 20px 24px 40px; max-width: 1100px; margin: 0 auto; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  .panel h3 { color: var(--gold); font-size: 15px; margin-bottom: 14px; font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; text-align: center;
  }
  .card .num { font-size: 30px; font-weight: 700; color: var(--gold); }
  .card .label { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
  .card .badge { display: inline-block; margin-top: 8px; font-size: 12px; padding: 2px 10px; border-radius: 20px; }
  .badge.ok { background: rgba(111,191,115,.15); color: var(--ok); }
  .badge.bad { background: rgba(232,93,76,.15); color: var(--fire); }
  button {
    background: var(--fire); color: #FFF; border: none; border-radius: 6px;
    padding: 8px 16px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: var(--fire-hover); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--gold); }
  button.ghost:hover { border-color: var(--gold); background: rgba(196,165,116,.08); }
  button.danger { background: transparent; border: 1px solid var(--fire); color: var(--fire); }
  button.danger:hover { background: var(--fire); color: #fff; }
  input, select, textarea {
    background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 9px 12px; font-size: 13px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .row input.flex { flex: 1; min-width: 200px; }
  .row .search-w { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--gold-dim); font-weight: 500; font-size: 12px; }
  td .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  td .actions button { padding: 4px 10px; font-size: 12px; }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-dim); }
  .empty { color: var(--text-dim); text-align: center; padding: 30px 0; font-size: 13px; }
  .msg { font-size: 12px; margin-top: 8px; }
  .msg.err { color: var(--fire); }
  .msg.okc { color: var(--ok); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px; margin-left: 6px; }
  .tag.on { background: rgba(111,191,115,.15); color: var(--ok); }
  .tag.off { background: rgba(232,93,76,.15); color: var(--fire); }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 70vh; }
  .login-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 36px 32px; width: 340px;
  }
  .login-box h2 { color: var(--gold); text-align: center; margin-bottom: 6px; }
  .login-box .sub { color: var(--text-dim); font-size: 12px; text-align: center; margin-bottom: 20px; }
  .login-box button { width: 100%; margin-top: 16px; padding: 10px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-actions { display: flex; gap: 10px; margin-top: 16px; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3);
          border-top-color: #fff; border-radius: 50%; animation: rot .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="logo">塑身工坊<span> · </span>管理后台</div>
  <div class="user" id="userBar" style="display:none">
    <span id="userName"></span><a onclick="logout()">退出登录</a>
  </div>
</header>

<div id="loginView" style="display:none">
  <div class="login-wrap">
    <div class="login-box">
      <h2>⚒ 管理后台登录</h2>
      <div class="sub">账号密码由环境变量 ADMIN_USER / ADMIN_PASS 初始化</div>
      <label>用户名</label>
      <input id="loginUser" placeholder="admin" autocomplete="username">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
      <button onclick="doLogin()">登 录</button>
      <div class="msg err" id="loginErr"></div>
    </div>
  </div>
</div>

<div id="appView" style="display:none">
  <div class="tabs">
    <button id="tab-dashboard" class="active" onclick="switchTab('dashboard')">仪表盘</button>
    <button id="tab-users" onclick="switchTab('users')">用户管理</button>
    <button id="tab-llm" onclick="switchTab('llm')">LLM 配置</button>
  </div>
  <main>
    <!-- 仪表盘 -->
    <section id="view-dashboard">
      <div class="cards">
        <div class="card"><div class="num" id="stUsers">-</div><div class="label">注册用户</div></div>
        <div class="card"><div class="num" id="stLlm">-</div><div class="label">LLM 配置</div></div>
        <div class="card"><div class="num" id="stDb">-</div><div class="label">数据库状态</div><div class="badge ok" id="stDbBadge">正常</div></div>
      </div>
    </section>

    <!-- 用户管理 -->
    <section id="view-users" style="display:none">
      <div class="panel">
        <h3>用户列表</h3>
        <div class="row">
          <input id="userQ" class="flex" placeholder="搜索邮箱或昵称…" onkeydown="if(event.key==='Enter')loadUsers(1)">
          <button onclick="loadUsers(1)">搜索</button>
        </div>
        <table>
          <thead><tr><th>ID</th><th>邮箱</th><th>昵称</th><th>注册时间</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
        <div class="empty" id="userEmpty" style="display:none">暂无用户</div>
        <div class="pager">
          <span id="userPageInfo"></span>
          <span><button class="ghost" onclick="loadUsers(page-1)">上一页</button>
                <button class="ghost" onclick="loadUsers(page+1)">下一页</button></span>
        </div>
      </div>
    </section>

    <!-- LLM 配置 -->
    <section id="view-llm" style="display:none">
      <div class="panel">
        <h3>新增 LLM 配置</h3>
        <div class="form-grid">
          <div><label>配置名 *</label><input id="cfName" placeholder="如：智谱 GLM 主服务"></div>
          <div><label>Provider</label><input id="cfProvider" value="zhipu"></div>
          <div><label>Base URL</label><input id="cfBaseUrl" value="https://open.bigmodel.cn"></div>
          <div><label>API Key *</label><input id="cfApiKey" placeholder="只存服务器"></div>
          <div><label>视觉模型</label><input id="cfVision" value="glm-4.6v-flash"></div>
          <div><label>文本模型</label><input id="cfText" value="glm-4-flash"></div>
          <div><label>优先级</label><input id="cfPriority" type="number" value="0"></div>
          <div><label>启用</label><select id="cfEnabled"><option value="1" selected>启用</option><option value="0">停用</option></select></div>
          <div class="full"><label>备注</label><input id="cfRemark" placeholder="选填"></div>
        </div>
        <div class="form-actions">
          <button onclick="createLlm()">新增配置</button>
          <button class="ghost" id="cfCancel" style="display:none" onclick="resetLlmForm()">取消编辑</button>
        </div>
        <div class="msg err" id="cfErr"></div>
      </div>

      <div class="panel">
        <h3>配置列表</h3>
        <table>
          <thead><tr><th>ID</th><th>名称</th><th>Provider</th><th>模型(视觉/文本)</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="llmRows"></tbody>
        </table>
        <div class="empty" id="llmEmpty" style="display:none">暂无配置，请先新增</div>
        <div class="msg okc" id="llmMsg"></div>
      </div>
    </section>
  </main>
</div>

<script>
const API = '/api/admin';
let token = localStorage.getItem('adminToken') || '';
let page = 1, pageSize = 20;
let editingLlmId = 0;

function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  return fetch(API + path, opts).then(r => {
    if (r.status === 401) { token = ''; localStorage.removeItem('adminToken'); showLogin(); throw new Error('未登录'); }
    return r.json();
  });
}

function showLogin() {
  document.getElementById('appView').style.display = 'none';
  document.getElementById('userBar').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}
function showApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('userBar').style.display = 'block';
  switchTab('dashboard');
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  api('/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) })
    .then(d => {
      if (!d.token) throw new Error(d.error || '登录失败');
      token = d.token; localStorage.setItem('adminToken', token);
      document.getElementById('userName').textContent = d.username;
      showApp(); loadStats();
    })
    .catch(e => { errEl.textContent = e.message || '网络错误'; });
}

function logout() {
  token = ''; localStorage.removeItem('adminToken'); showLogin();
  document.getElementById('loginPass').value = '';
}

function switchTab(name) {
  ['dashboard', 'users', 'llm'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
    document.getElementById('view-' + t).style.display = t === name ? 'block' : 'none';
  });
  if (name === 'users') loadUsers(1);
  if (name === 'llm') { loadLlm(); }
  if (name === 'dashboard') loadStats();
}

/* ---- 仪表盘 ---- */
function loadStats() {
  api('/stats').then(d => {
    document.getElementById('stUsers').textContent = d.users ?? '-';
    document.getElementById('stLlm').textContent = d.llmConfigs ?? '-';
    const ok = !!d.dbOk;
    document.getElementById('stDb').textContent = ok ? '正常' : '不可用';
    const b = document.getElementById('stDbBadge');
    b.className = 'badge ' + (ok ? 'ok' : 'bad');
    b.textContent = ok ? '已连接' : '未连接';
  }).catch(() => {});
}

/* ---- 用户管理 ---- */
function loadUsers(p) {
  if (!p || p < 1) p = 1;
  page = p;
  const q = document.getElementById('userQ').value.trim();
  api('/users?q=' + encodeURIComponent(q) + '&page=' + page + '&pageSize=' + pageSize)
    .then(d => {
      const rows = document.getElementById('userRows');
      rows.innerHTML = '';
      document.getElementById('userEmpty').style.display = d.items.length ? 'none' : 'block';
      d.items.forEach(u => {
        const tr = document.createElement('tr');
        const stateTag = u.isDisabled
          ? '<span class="tag off">已禁用</span>'
          : '<span class="tag on">正常</span>';
        const actions = u.isDisabled
          ? `<button class="ghost" onclick="setDisabled(${u.id},false)">启用</button>`
          : `<button class="ghost" onclick="setDisabled(${u.id},true)">禁用</button>`;
        tr.innerHTML = `<td>${u.id}</td><td>${esc(u.email)}</td><td>${esc(u.nickname)}</td>
          <td>${esc(fmtTime(u.createdAt))}</td><td>${stateTag}</td>
          <td><div class="actions">${actions}<button onclick="resetPw(${u.id})">重置密码</button></div></td>`;
        rows.appendChild(tr);
      });
      document.getElementById('userPageInfo').textContent = `共 ${d.total} 人 · 第 ${page} 页`;
    }).catch(() => {});
}

function setDisabled(id, disabled) {
  api(`/users/${id}/${disabled ? 'disable' : 'enable'}`, { method: 'POST' })
    .then(() => loadUsers(page)).catch(e => alert(e.message));
}
function resetPw(id) {
  const pw = prompt('请输入新密码（至少 6 位）：');
  if (!pw) return;
  if (pw.length < 6) { alert('密码至少 6 位'); return; }
  api(`/users/${id}/reset-password`, { method: 'POST', body: JSON.stringify({ password: pw }) })
    .then(() => alert('密码已重置')).catch(e => alert(e.message));
}

/* ---- LLM 配置 ---- */
function loadLlm() {
  api('/llm').then(d => {
    const rows = document.getElementById('llmRows');
    rows.innerHTML = '';
    document.getElementById('llmEmpty').style.display = d.items.length ? 'none' : 'block';
    d.items.forEach(c => {
      const tr = document.createElement('tr');
      const stateTag = c.enabled ? '<span class="tag on">启用</span>' : '<span class="tag off">停用</span>';
      const keyTip = c.apiKey ? `（${esc(c.apiKey)}）` : '';
      tr.innerHTML = `<td>${c.id}</td><td>${esc(c.name)}<br><span style="color:var(--text-dim);font-size:11px">key${keyTip}</span></td>
        <td>${esc(c.provider)}</td><td>${esc(c.visionModel)} / ${esc(c.textModel)}</td>
        <td>${c.priority}</td><td>${stateTag}</td>
        <td><div class="actions">
          <button class="ghost" onclick="editLlm(${c.id})">编辑</button>
          <button class="ghost" onclick="testLlm(${c.id},this)">测试</button>
          <button class="ghost" onclick="toggleLlm(${c.id},${!c.enabled})">${c.enabled ? '停用' : '启用'}</button>
          <button class="danger" onclick="delLlm(${c.id})">删除</button>
        </div></td>`;
      rows.appendChild(tr);
    });
  }).catch(() => {});
}

function createLlm() {
  const body = {
    name: v('cfName'), provider: v('cfProvider'), baseUrl: v('cfBaseUrl'),
    apiKey: v('cfApiKey'), visionModel: v('cfVision'), textModel: v('cfText'),
    priority: parseInt(v('cfPriority') || '0', 10),
    enabled: document.getElementById('cfEnabled').value === '1',
    remark: v('cfRemark'),
  };
  const errEl = document.getElementById('cfErr');
  errEl.textContent = '';
  if (!body.name || !body.apiKey) { errEl.textContent = '配置名与 API Key 为必填'; return; }
  if (editingLlmId) {
    body.apiKey = body.apiKey; // 脱敏值不更新由后端处理
    api('/llm/' + editingLlmId, { method: 'PUT', body: JSON.stringify(body) })
      .then(() => { resetLlmForm(); loadLlm(); })
      .catch(e => { errEl.textContent = e.message; });
  } else {
    api('/llm', { method: 'POST', body: JSON.stringify(body) })
      .then(() => { resetLlmForm(); loadLlm(); })
      .catch(e => { errEl.textContent = e.message; });
  }
}

function editLlm(id) {
  api('/llm').then(d => {
    const c = d.items.find(x => x.id === id);
    if (!c) return;
    editingLlmId = id;
    document.getElementById('cfName').value = c.name;
    document.getElementById('cfProvider').value = c.provider;
    document.getElementById('cfBaseUrl').value = c.baseUrl;
    document.getElementById('cfApiKey').value = c.apiKey; // 脱敏值，提交不更新
    document.getElementById('cfApiKey').placeholder = '留空或脱敏值 = 不修改';
    document.getElementById('cfVision').value = c.visionModel;
    document.getElementById('cfText').value = c.textModel;
    document.getElementById('cfPriority').value = c.priority;
    document.getElementById('cfEnabled').value = c.enabled ? '1' : '0';
    document.getElementById('cfRemark').value = c.remark || '';
    document.getElementById('cfCancel').style.display = 'inline-block';
  });
}
function resetLlmForm() {
  editingLlmId = 0;
  ['cfName','cfApiKey','cfRemark'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('cfProvider').value = 'zhipu';
  document.getElementById('cfBaseUrl').value = 'https://open.bigmodel.cn';
  document.getElementById('cfVision').value = 'glm-4.6v-flash';
  document.getElementById('cfText').value = 'glm-4-flash';
  document.getElementById('cfPriority').value = '0';
  document.getElementById('cfEnabled').value = '1';
  document.getElementById('cfApiKey').placeholder = '只存服务器';
  document.getElementById('cfCancel').style.display = 'none';
}

function testLlm(id, btn) {
  const old = btn.innerHTML;
  btn.innerHTML = '<span class="spin"></span>测试中';
  btn.disabled = true;
  api('/llm/' + id + '/test', { method: 'POST' })
    .then(d => {
      const m = document.getElementById('llmMsg');
      m.className = 'msg ' + (d.ok ? 'okc' : 'err');
      m.textContent = d.ok ? `连通正常，延迟 ${d.latencyMs}ms` : ('测试失败: ' + (d.error || '未知错误'));
    })
    .catch(e => { document.getElementById('llmMsg').className = 'msg err'; document.getElementById('llmMsg').textContent = e.message; })
    .finally(() => { btn.innerHTML = old; btn.disabled = false; });
}

function toggleLlm(id, enabled) {
  api('/llm/' + id, { method: 'PUT', body: JSON.stringify({ enabled }) })
    .then(() => loadLlm()).catch(e => alert(e.message));
}
function delLlm(id) {
  if (!confirm('确认删除该 LLM 配置？')) return;
  api('/llm/' + id, { method: 'DELETE' })
    .then(() => loadLlm()).catch(e => alert(e.message));
}

/* ---- 工具 ---- */
function v(id) { return document.getElementById(id).value.trim(); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(s) { return s ? s.replace('T', ' ').slice(0, 16) : ''; }

/* ---- 初始化 ---- */
if (token) {
  api('/stats').then(d => {
    document.getElementById('userName').textContent = localStorage.getItem('adminName') || 'admin';
    showApp(); loadStats();
  }).catch(() => showLogin());
} else {
  showLogin();
}
document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
